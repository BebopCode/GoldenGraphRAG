# Application tuning. Connection secrets/hosts live in .env (see .env.example).
# Copy to settings.yaml and edit, or rely on the defaults below.
# Env vars (LLM_*) win where they overlap with the llm: block here.

llm:
  # Endpoint identity normally comes from .env (LLM_PROVIDER/MODEL/BASE_URL/KEY);
  # these knobs are safe to keep in YAML.
  temperature: 0.0          # deterministic extraction
  json_mode: true           # ask for strict JSON output (implied by structured mode)
  timeout: 120              # per-request timeout, seconds
  max_retries: 2            # SDK-level retries with backoff
  concurrency: 2            # parallel chunk extractions (threads). Stay low on
                            # hosted APIs — they cap tokens/min by spend tier and
                            # each extraction is ~1-3k tokens; high concurrency
                            # 429-storms and skipped chunks follow. Raise only on
                            # self-hosted endpoints (vLLM: 32 is reasonable).
  # auto: send the JSON schema, degrade if the endpoint rejects it.
  # json_schema | json_object | none pin the behaviour once you know the endpoint.
  structured_mode: auto
  # allowed_providers: [Groq, DeepInfra]   # OpenRouter routing allowlist
  # max_tokens: 4096                       # cap output tokens
  # extra_headers:                          # e.g. OpenRouter attribution
  #   HTTP-Referer: https://example.com
  #   X-Title: kg-pipeline

ingest:
  chunker: fixed             # fixed | structural (also settable via CHUNKER env)
  fixed:
    chunk_size: 1200         # characters per chunk (fixed chunker only)
    chunk_overlap: 200       # overlap between adjacent chunks

extract:
  batch_size: 8              # chunks processed before a progress flush (logging)
  max_retries: 1             # retries on malformed JSON before skipping a chunk

fusion:
  # Off by default; turn on to merge near-duplicate entity names with embeddings.
  use_embeddings: false
